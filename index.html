<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aesthetic Secret Diary 🧸✨</title>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #ffe6ee 0%, #f0e6ff 100%);
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
      min-height: 100vh;
    }

    /* Fixed Floating Layer */
    .floating-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .emoji-item {
      position: absolute;
      font-size: 28px;
      user-select: none;
    }

    /* Upward Animation (Happy, Love, Teddy) */
    @keyframes floatUpAnim {
      0% {
        transform: translateY(320px) scale(0.6) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% {
        transform: translateY(-40px) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* Downward Rain Animation (Sad Mood) */
    @keyframes fallDownAnim {
      0% {
        transform: translateY(-30px) scale(0.8);
        opacity: 0;
      }
      20% { opacity: 0.9; }
      80% { opacity: 0.8; }
      100% {
        transform: translateY(350px) scale(1.1);
        opacity: 0.1;
      }
    }

    .anim-up {
      animation: floatUpAnim 5s linear infinite;
    }

    .anim-down {
      animation: fallDownAnim 3.5s linear infinite;
    }

    /* UI Layout Styles */
    .app-card {
      max-width: 750px;
      margin: 30px auto;
      padding: 20px;
    }

    .setup-screen {
      max-width: 420px;
      margin: 60px auto;
      padding: 35px 25px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.25);
      text-align: center;
      border: 3px solid #ffb6c1;
    }

    .login-screen {
      max-width: 450px;
      margin: 50px auto;
      padding: 35px;
      background: linear-gradient(135deg, #fff0f5 0%, #f3e5f5 100%);
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(186, 104, 200, 0.25);
      text-align: center;
      border: 3px solid #ce93d8;
      position: relative;
      min-height: 380px;
      overflow: hidden;
    }

    .btn {
      padding: 10px 22px;
      border-radius: 20px;
      border: none;
      background: #ff69b4;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      transition: transform 0.2s;
    }

    .btn:hover { transform: scale(1.05); }
    .btn-submit { background: #8e24aa; width: 100%; padding: 12px; margin-top: 10px; font-size: 16px; }
    .btn-danger { background: #ff5252; }

    .input-box {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 2px solid #ffcdd2;
      font-family: inherit;
      font-size: 15px;
      outline: none;
    }

    .error-msg { color: #d32f2f; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Fixed Animation Component
    const FloatingDecorations = ({ mood }) => {
      const getDecorations = () => {
        switch (mood) {
          case 'happy': return ['🧸', '🌸', '🌼', '🌺', '✨', '🎈'];
          case 'sad': return ['🌧️', '💧', '☁️', '🥺', '💧'];
          case 'love': return ['💖', '🌹', '💕', '✨', '💐', '💌'];
          case 'teddy': return ['🧸', '🌸', '💖', '🎈', '✨'];
          default: return ['🌸', '✨'];
        }
      };

      const items = getDecorations();

      return (
        <div className="floating-layer">
          {Array.from({ length: 10 }).map((_, i) => {
            const item = items[i % items.length];
            const leftPos = (i * 10) + 2; // Separate positions horizontally
            const delay = (i * 0.5) % 3;

            return (
              <span
                key={i}
                className={`emoji-item ${mood === 'sad' ? 'anim-down' : 'anim-up'}`}
                style={{
                  left: `${leftPos}%`,
                  animationDelay: `${delay}s`
                }}
              >
                {item}
              </span>
            );
          })}
        </div>
      );
    };

    function App() {
      const [step, setStep] = useState(1);
      const [masterCode, setMasterCode] = useState('');
      const [inputMasterCode, setInputMasterCode] = useState('');
      const [newMasterCode, setNewMasterCode] = useState('');

      const [friendName, setFriendName] = useState('');
      const [enteredPin, setEnteredPin] = useState('');

      const [activeTab, setActiveTab] = useState('write');
      const [title, setTitle] = useState('');
      const [content, setContent] = useState('');
      const [mood, setMood] = useState('happy');
      const [diaryPages, setDiaryPages] = useState([]);
      const [currentPage, setCurrentPage] = useState(1);
      const [jumpPageInput, setJumpPageInput] = useState('');
      const [message, setMessage] = useState('');
      const [errorMsg, setErrorMsg] = useState('');

      const moodThemes = {
        happy: {
          bg: 'linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%)',
          border: '2px solid #ffb6c1',
          badge: '😊 Happy Day (Teddy & Flowers)',
          fontColor: '#4a2e35'
        },
        sad: {
          bg: 'linear-gradient(135deg, #e6f2ff 0%, #cfe2ff 100%)',
          border: '2px solid #a2c4ec',
          badge: '😢 Feeling Low (Raindrops)',
          fontColor: '#1e3a5f'
        },
        love: {
          bg: 'linear-gradient(135deg, #fff0f3 0%, #ffccd5 100%)',
          border: '2px solid #ff4d6d',
          badge: '❤️ Loving Mood (Roses & Hearts)',
          fontColor: '#590d22'
        }
      };

      const handleMasterSetup = (e) => {
        e.preventDefault();
        if (!newMasterCode.trim()) return;
        setMasterCode(newMasterCode);
        setStep(2);
        setErrorMsg('');
      };

      const handleMasterVerify = (e) => {
        e.preventDefault();
        if (inputMasterCode === masterCode) {
          setStep(2);
          setErrorMsg('');
          setInputMasterCode('');
        } else {
          setErrorMsg('❌ Invalid Details! Access Denied.');
        }
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (enteredPin === masterCode) {
          setStep(3);
          setErrorMsg('');
        } else {
          setErrorMsg('❌ Invalid Secret Password!');
        }
      };

      const handleSavePage = (e) => {
        e.preventDefault();
        const newPage = {
          id: Date.now(),
          pageNumber: diaryPages.length + 1,
          title,
          content,
          mood,
          date: new Date().toLocaleDateString()
        };
        setDiaryPages([...diaryPages, newPage]);
        setMessage(`Page #${newPage.pageNumber} Saved Successfully! 🔒`);
        setTitle('');
        setContent('');
      };

      const handleJumpToPage = (e) => {
        e.preventDefault();
        const pNum = Number(jumpPageInput);
        if (pNum >= 1 && pNum <= diaryPages.length) {
          setCurrentPage(pNum);
          setJumpPageInput('');
          setMessage('');
        } else {
          alert(`Enter page number between 1 and ${diaryPages.length}`);
        }
      };

      // STEP 1: PASSWORD SETUP / VERIFY
      if (step === 1) {
        return (
          <div className="setup-screen">
            <div style={{ fontSize: '40px', marginBottom: '10px' }}>🔐✨</div>
            <h2 style={{ color: '#ff1493', margin: '0 0 15px 0' }}>Secret Security Guard</h2>

            {!masterCode ? (
              <form onSubmit={handleMasterSetup}>
                <p style={{ color: '#555', fontSize: '14px' }}>Create Secret Password for Diary:</p>
                <input className="input-box" type="password" placeholder="Create Secret Password" value={newMasterCode} onChange={(e) => setNewMasterCode(e.target.value)} required />
                <button type="submit" className="btn btn-submit" style={{ background: '#ff69b4' }}>Set Password & Proceed ▶</button>
              </form>
            ) : (
              <form onSubmit={handleMasterVerify}>
                <p style={{ color: '#555', fontSize: '14px' }}>Enter Secret Password to Continue:</p>
                <input className="input-box" type="password" placeholder="Enter Secret Password" value={inputMasterCode} onChange={(e) => setInputMasterCode(e.target.value)} required />
                <button type="submit" className="btn btn-submit" style={{ background: '#ff69b4' }}>Verify Secret Code ▶</button>
              </form>
            )}

            {errorMsg && <p className="error-msg">{errorMsg}</p>}
          </div>
        );
      }

      // STEP 2: LOGIN SCREEN WITH ANIMATIONS
      if (step === 2) {
        return (
          <div className="login-screen">
            <FloatingDecorations mood="teddy" />

            <div style={{ position: 'relative', zIndex: 2 }}>
              <div style={{ fontSize: '45px', marginBottom: '5px' }}>🧸🌸</div>
              <h2 style={{ color: '#8e24aa', margin: '0 0 10px 0' }}>Welcome to Secret World</h2>
              <p style={{ color: '#7b1fa2', fontSize: '14px', marginBottom: '20px' }}>Enter details to open your Diary</p>

              <form onSubmit={handleLogin}>
                <input className="input-box" type="text" placeholder="Your Name / Nickname" value={friendName} onChange={(e) => setFriendName(e.target.value)} required />
                <input className="input-box" type="password" placeholder="Enter Your Secret Password" value={enteredPin} onChange={(e) => setEnteredPin(e.target.value)} required />
                <button type="submit" className="btn btn-submit">📖 Open My Diary</button>
              </form>

              {errorMsg && <p className="error-msg">{errorMsg}</p>}
            </div>
          </div>
        );
      }

      // STEP 3: MAIN DIARY APP
      const activeEntry = diaryPages[currentPage - 1];

      return (
        <div className="app-card">
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '15px' }}>
            <h1 style={{ color: '#d81b60', margin: 0, fontSize: '24px' }}>
              🎀 {friendName ? `${friendName}'s Secret Diary` : 'My Secret Diary'} 📖
            </h1>
            <button className="btn btn-danger" onClick={() => { setStep(1); setErrorMsg(''); }}>🔒 Lock Diary</button>
          </div>

          <div style={{ display: 'flex', justifyContent: 'center', gap: '15px', margin: '15px 0' }}>
            <button className="btn" onClick={() => { setActiveTab('write'); setMessage(''); }}>✍️ Write Page</button>
            <button className="btn" onClick={() => { setActiveTab('read'); setMessage(''); }}>📖 Read Pages</button>
          </div>

          {message && <p style={{ textAlign: 'center', color: '#8e24aa', fontWeight: 'bold' }}>{message}</p>}

          {/* WRITE PAGE VIEW */}
          {activeTab === 'write' && (
            <form onSubmit={handleSavePage} style={{ background: '#fff', padding: '25px', borderRadius: '20px', boxShadow: '0 8px 25px rgba(0,0,0,0.08)' }}>
              <h3 style={{ margin: '0 0 15px 0', color: '#ad1457' }}>Write Page #{diaryPages.length + 1}</h3>
              
              <label style={{ display: 'block', marginBottom: '8px', fontWeight: 'bold', color: '#555' }}>Select Mood for this Page:</label>
              <div style={{ display: 'flex', gap: '15px', marginBottom: '15px' }}>
                <label style={{ cursor: 'pointer' }}>
                  <input type="radio" value="happy" checked={mood === 'happy'} onChange={(e) => setMood(e.target.value)} /> 😊 Happy (Teddy & Flowers)
                </label>
                <label style={{ cursor: 'pointer' }}>
                  <input type="radio" value="sad" checked={mood === 'sad'} onChange={(e) => setMood(e.target.value)} /> 😢 Sad (Raindrops)
                </label>
                <label style={{ cursor: 'pointer' }}>
                  <input type="radio" value="love" checked={mood === 'love'} onChange={(e) => setMood(e.target.value)} /> ❤️ Love (Roses & Hearts)
                </label>
              </div>

              <input className="input-box" type="text" placeholder="Title" value={title} onChange={(e) => setTitle(e.target.value)} required />
              <textarea className="input-box" placeholder="Dear Diary, today I felt..." rows="7" value={content} onChange={(e) => setContent(e.target.value)} required />
              
              <button type="submit" className="btn btn-submit" style={{ background: '#4caf50' }}>✨ Lock & Save Page</button>
            </form>
          )}

          {/* READ DIARY VIEW */}
          {activeTab === 'read' && (
            <div>
              {diaryPages.length === 0 ? (
                <div style={{ textAlign: 'center', padding: '40px', background: '#fff', borderRadius: '20px' }}>
                  <p style={{ color: '#888', fontSize: '18px' }}>No pages written yet! Click "Write Page" to create your first page.</p>
                </div>
              ) : (
                <div>
                  <form onSubmit={handleJumpToPage} style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px', marginBottom: '15px' }}>
                    <input 
                      type="number" 
                      placeholder="Jump to Page #" 
                      value={jumpPageInput} 
                      onChange={(e) => setJumpPageInput(e.target.value)} 
                      style={{ padding: '8px 12px', borderRadius: '10px', border: '1px solid #ccc', width: '130px' }}
                    />
                    <button type="submit" className="btn" style={{ padding: '8px 15px' }}>Go</button>
                  </form>

                  {/* ACTIVE PAGE DISPLAY WITH ANIMATION */}
                  {activeEntry && (
                    <div style={{
                      background: moodThemes[activeEntry.mood].bg,
                      border: moodThemes[activeEntry.mood].border,
                      borderRadius: '20px',
                      padding: '30px',
                      position: 'relative',
                      overflow: 'hidden',
                      boxShadow: '0 10px 25px rgba(0,0,0,0.12)',
                      minHeight: '340px',
                      color: moodThemes[activeEntry.mood].fontColor
                    }}>
                      {/* Animated Floating Layer */}
                      <FloatingDecorations mood={activeEntry.mood} />

                      <div style={{ position: 'relative', zIndex: 2 }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', borderBottom: '2px dashed #bbb', paddingBottom: '10px' }}>
                          <h2 style={{ margin: 0 }}>{activeEntry.title}</h2>
                          <span style={{ fontWeight: 'bold', fontSize: '18px' }}>Page #{activeEntry.pageNumber}</span>
                        </div>

                        <div style={{ fontSize: '14px', marginTop: '8px', fontStyle: 'italic' }}>
                          Mood: <b>{moodThemes[activeEntry.mood].badge}</b>
                        </div>

                        <p style={{ fontSize: '18px', lineHeight: '2.0', marginTop: '20px', whiteSpace: 'pre-line', background: 'rgba(255, 255, 255, 0.55)', padding: '15px', borderRadius: '12px' }}>
                          {activeEntry.content}
                        </p>

                        <div style={{ textAlign: 'right', marginTop: '15px', fontSize: '13px', opacity: 0.8 }}>
                          🗓️ Written on: {activeEntry.date}
                        </div>
                      </div>
                    </div>
                  )}

                  <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '20px', marginTop: '20px' }}>
                    <button className="btn" disabled={currentPage === 1} onClick={() => setCurrentPage(currentPage - 1)}>◀ Prev Page</button>
                    <span style={{ fontWeight: 'bold' }}>Page {currentPage} of {diaryPages.length}</span>
                    <button className="btn" disabled={currentPage === diaryPages.length} onClick={() => setCurrentPage(currentPage + 1)}>Next Page ▶</button>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
